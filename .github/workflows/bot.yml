name: BTC AI BOT V5.5

on:
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar BTC AI BOT
        run: |
          python bot.py

      - name: Guardar resultados
        run: |
          git config --global user.name "BTC AI
BOT"
          git config --global user.email
"bot@users.noreply.github.com"

          for archivo in estado.csv trades.csv
senales.csv equity.csv log.csv; do
            if [ -f "$archivo" ]; then
              git add "$archivo"
            fi
          done


          git diff --cached --quiet || git commit
-m "Actualización automática BTC AI BOT"

          git push
